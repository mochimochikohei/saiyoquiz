<style>

/* 入口の4基エレベーター表示 */
.elevator-bank:before{content:"";position:absolute;z-index:-1;inset:-18px;border-radius:14px;background:rgba(13,18,22,.32);backdrop-filter:blur(1px)}.elevator-bank{position:absolute;z-index:8;top:13%;left:50%;display:flex;gap:clamp(7px,1.2vw,17px);width:min(94%,1100px);height:52%;transform:translateX(-50%);perspective:1000px}.lobby-lift{position:relative;flex:1;min-width:0;overflow:hidden;border-top:28px solid #687377;border-right:10px solid #3c484c;border-left:10px solid #899397;background:linear-gradient(90deg,#3d484c,#8c989b 48%,#313c40);box-shadow:0 0 0 2px #141b1ecc,0 16px 26px #0006}.lobby-lift:nth-child(1){transform:rotateY(-3deg)}.lobby-lift:nth-child(2){transform:translateY(-2px)}.lobby-lift:nth-child(3){transform:rotateY(2deg)}.lobby-lift:nth-child(4){transform:translateY(2px) rotateY(4deg)}.lift-destination{position:absolute;z-index:12;top:2px;left:0;right:0;color:#e02b35;font-size:clamp(7px,1vw,12px);font-weight:900;line-height:18px;text-align:center;text-shadow:0 0 3px #a60000;white-space:nowrap}.lift-destination.small{font-size:clamp(5px,.75vw,9px)}.lift-front{position:absolute;z-index:3;inset:8% 9% 2%;display:flex;align-items:center;justify-content:center;overflow:hidden;border:5px solid #242b2ee0;background:repeating-linear-gradient(90deg,#71868b29 0 4px,transparent 5px 14px),linear-gradient(90deg,#091315,#1c2a2d,#091315);box-shadow:inset 0 0 32px #000f}.lift-number{color:#94a647;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(60px,9vw,125px);font-weight:700;line-height:.68;letter-spacing:-.11em;text-shadow:1px 1px 0 #2931146b;transform:scaleX(.82) scaleY(2.15)}.lift-glass{position:absolute;z-index:5;top:13%;bottom:6%;left:50%;width:27px;border:2px solid #aecfcdd0;background:linear-gradient(90deg,#7899992e,#e7f7f685,#6689892e);transform:translateX(-50%)}.lobby-lift.target{transition:filter .4s,box-shadow .4s}.lobby-lift.target.calling{filter:brightness(1.13);box-shadow:0 0 0 3px #d5dc8b,0 0 28px #d5dc8b99}.target .lift-front{transition:transform 1s cubic-bezier(.5,0,.2,1),opacity .4s}.target.opening .lift-front{transform:scaleX(.08);opacity:.15}.target-interior{position:absolute;z-index:2;inset:8% 9% 2%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#30393c,#111719 58%,#030606);box-shadow:inset 0 0 45px #000;color:#ffb000;font:900 clamp(14px,2vw,27px) monospace;text-shadow:0 0 12px #ff7b00}.entrance-card{position:relative;z-index:10}

/* 04号機：二枚扉による丁寧な開閉演出 */
.target{isolation:isolate}.target-interior{overflow:hidden;opacity:.25;filter:brightness(.45);transition:opacity .42s ease,filter .42s ease}.target-interior:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0a0e10,#2c3437 18%,#141a1c 50%,#2c3437 82%,#0a0e10)}.interior-light{position:absolute;z-index:2;top:3%;left:13%;right:13%;height:8%;background:linear-gradient(90deg,#6d5630,#ffe4a1,#6d5630);box-shadow:0 0 22px #ffd27199}.interior-display{position:relative;z-index:3;margin-top:-4%;padding:8px 13px;border:2px solid #5a6062;border-radius:5px;background:#090c0d;color:#ffb000;font:900 clamp(13px,1.7vw,23px) monospace;letter-spacing:.08em;text-shadow:0 0 9px #ff7900}.interior-floor{position:absolute;z-index:2;left:4%;right:4%;bottom:0;height:22%;background:linear-gradient(165deg,#6b7172,#252b2d 55%,#0d1112);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}.target-door{position:absolute;z-index:7;top:8%;bottom:2%;width:41%;overflow:hidden;border:5px solid #242b2ee0;background:repeating-linear-gradient(90deg,#71868b29 0 4px,transparent 5px 14px),linear-gradient(90deg,#091315,#1c2a2d,#091315);box-shadow:inset 0 0 32px #000f;transition:transform 1.38s cubic-bezier(.62,.02,.19,1),filter .35s ease}.target-door-left{left:9%;border-right-width:2px;transform:translateX(0)}.target-door-right{right:9%;border-left-width:2px;transform:translateX(0)}.target-half-number{position:absolute;top:50%;color:#94a647;font-family:Impact,"Arial Black",sans-serif;font-size:clamp(60px,9vw,125px);font-weight:700;line-height:.68;text-shadow:1px 1px 0 #2931146b}.number-zero{right:-8px;transform:translateY(-50%) scaleX(.82) scaleY(2.15);transform-origin:right center}.number-four{left:-8px;transform:translateY(-50%) scaleX(.82) scaleY(2.15);transform-origin:left center}.target-seam{position:absolute;z-index:9;top:13%;bottom:6%;left:50%;width:25px;border:2px solid #aecfcdd0;background:linear-gradient(90deg,#7899992e,#e7f7f685,#6689892e);box-shadow:0 0 7px #c9eae933;transform:translateX(-50%);transition:opacity .22s ease .12s}.target.calling .target-door{filter:brightness(1.12)}.target.calling .target-interior{opacity:.48;filter:brightness(.7)}.target.opening .target-door-left{transform:translateX(-101%)}.target.opening .target-door-right{transform:translateX(101%)}.target.opening .target-seam{opacity:0;transition-delay:0s}.target.opening .target-interior{opacity:1;filter:brightness(1);transition-delay:.42s}.target.opening{box-shadow:0 0 0 3px #d5dc8b,0 0 28px #d5dc8b99}.target .lift-glass,.target .lift-front{display:none!important}

/* 04号機内部：ガラス張りの吹き抜けを感じる透明デザイン */
.target-interior{background:linear-gradient(180deg,rgba(8,17,24,.68),rgba(12,25,33,.52) 57%,rgba(5,12,17,.74));border:1px solid rgba(195,232,245,.24);box-shadow:inset 0 0 32px rgba(0,0,0,.86),inset 0 0 16px rgba(131,202,226,.11);backdrop-filter:blur(1.4px)}.target-interior:before{display:none}.glass-backdrop{position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(176,216,234,.13),transparent 28%,rgba(92,151,178,.09) 63%,rgba(9,21,28,.3)),repeating-linear-gradient(90deg,rgba(186,222,236,.1) 0 2px,transparent 2px 22%),repeating-linear-gradient(180deg,transparent 0 18%,rgba(179,218,233,.12) 18.4% 19%);opacity:.92}.glass-backdrop:after{content:"";position:absolute;left:10%;right:10%;top:22%;height:29%;border:2px solid rgba(193,228,240,.22);background:linear-gradient(135deg,rgba(193,229,242,.12),rgba(42,85,105,.05));box-shadow:0 0 16px rgba(134,204,230,.1)}.glass-grid-lines{position:absolute;z-index:2;inset:8% 7% 17%;background:repeating-linear-gradient(90deg,transparent 0 20%,rgba(185,220,232,.18) 20.5% 21.4%),repeating-linear-gradient(180deg,transparent 0 24%,rgba(185,220,232,.16) 24.5% 25.2%);opacity:.7}.glass-rail{position:absolute;z-index:3;left:0;right:0;top:59%;height:7%;border-top:2px solid rgba(210,237,246,.28);border-bottom:1px solid rgba(91,142,163,.28);background:linear-gradient(180deg,rgba(171,217,234,.13),rgba(14,35,45,.25));box-shadow:0 7px 18px rgba(0,0,0,.28)}.glass-reflection{position:absolute;z-index:4;top:-15%;height:130%;width:18%;background:linear-gradient(90deg,transparent,rgba(220,244,251,.12),transparent);transform:skewX(-15deg);filter:blur(.4px)}.reflection-left{left:4%}.reflection-right{right:8%;width:10%;opacity:.65}.interior-display{position:absolute;z-index:7;top:54%;left:50%;margin:0;transform:translate(-50%,-50%);padding:7px 12px;border:2px solid rgba(188,220,231,.48);border-radius:5px;background:rgba(4,9,12,.76);box-shadow:0 0 12px rgba(119,188,215,.14),inset 0 0 7px rgba(0,0,0,.9);color:#ffb000;font:900 clamp(13px,1.7vw,23px) monospace;letter-spacing:.08em;text-shadow:0 0 8px #ff7900}.interior-floor{z-index:5;left:7%;right:7%;bottom:0;height:22%;background:linear-gradient(165deg,rgba(126,151,160,.47),rgba(34,51,59,.56) 52%,rgba(8,16,21,.83));border-top:1px solid rgba(208,234,242,.26);clip-path:polygon(13% 0,87% 0,100% 100%,0 100%)}.target.calling .target-interior{opacity:.62;filter:brightness(.82)}.target.opening .target-interior{opacity:1;filter:brightness(1.12) saturate(.92)}

/* 04号機へ歩いて乗り込むカメラ演出 */
.entrance-walk-layer{position:absolute;z-index:45;inset:0;overflow:hidden;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility .35s}.entrance-walk-layer.active{opacity:1;visibility:visible}.walk-vignette{position:absolute;inset:-3%;background:radial-gradient(ellipse at 50% 48%,transparent 28%,rgba(3,7,10,.2) 60%,rgba(0,0,0,.73) 100%);transform:scale(1.05);transition:transform 1.9s cubic-bezier(.18,.73,.2,1),opacity .45s ease}.entrance-walk-layer.active .walk-vignette{transform:scale(1.24)}.walk-floor{position:absolute;left:50%;bottom:-17%;width:70%;height:45%;transform:translateX(-50%) perspective(520px) rotateX(60deg);transform-origin:center bottom;background:linear-gradient(180deg,rgba(149,179,189,.08),rgba(9,18,24,.72)),repeating-linear-gradient(90deg,transparent 0 18%,rgba(185,218,229,.13) 18.5% 19.2%);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);opacity:0;transition:opacity .45s .16s,transform 1.9s cubic-bezier(.18,.73,.2,1)}.entrance-walk-layer.active .walk-floor{opacity:1;transform:translateX(-50%) perspective(520px) rotateX(60deg) translateY(14%)}.walk-message{position:absolute;left:50%;bottom:7%;min-width:250px;padding:12px 20px;border:2px solid rgba(255,249,212,.88);border-radius:999px;background:rgba(22,30,47,.8);color:#fff;font-weight:800;text-align:center;letter-spacing:.06em;transform:translate(-50%,18px);opacity:0;backdrop-filter:blur(5px);transition:opacity .35s .2s,transform .45s .2s}.entrance-walk-layer.active .walk-message{opacity:1;transform:translate(-50%,0)}.real-entrance.walking-in .elevator-bank{transform:translateX(-50%) scale(2.32);transform-origin:85% 48%;transition:transform 2s cubic-bezier(.18,.73,.2,1),filter 1.5s ease;filter:brightness(.82)}.real-entrance.walking-in .entrance-card{opacity:0;transform:translateY(28px);transition:opacity .35s,transform .35s}.real-entrance.inside-lift .elevator-bank{transform:translateX(-50%) scale(3.15);filter:brightness(.48) blur(.3px)}.real-entrance.inside-lift .entrance-walk-layer{background:rgba(2,6,9,.28)}.boarding-blackout{position:fixed;z-index:900;inset:0;background:#030608;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .65s,visibility .65s}.boarding-blackout.show{opacity:1;visibility:visible}.boarding-blackout:after{content:"ELEVATOR 04";position:absolute;top:50%;left:50%;color:#ffb000;font:900 clamp(18px,4vw,34px) Arial,sans-serif;letter-spacing:.15em;text-shadow:0 0 15px #ff7900;transform:translate(-50%,-50%);opacity:0;transition:opacity .35s .25s}.boarding-blackout.show:after{opacity:1}

/* 04号機へ視線を寄せる二段階ズーム */
.real-entrance{--zoom-x:82%;--zoom-y:43%}.real-entrance.zoom-to-04 .elevator-bank{transform:translateX(-50%) scale(1.36);transform-origin:86% 48%;filter:brightness(.9);transition:transform .95s cubic-bezier(.18,.75,.2,1),filter .7s ease}.real-entrance.walking-in .elevator-bank{transform:translateX(-50%) scale(2.5);transform-origin:86% 48%;filter:brightness(.79);transition:transform 1.65s cubic-bezier(.16,.79,.19,1),filter 1.2s ease}.real-entrance.inside-lift .elevator-bank{transform:translateX(-50%) scale(3.35);transform-origin:86% 48%;filter:brightness(.48) blur(.3px);transition:transform .72s cubic-bezier(.25,.7,.25,1),filter .65s}.real-entrance.zoom-to-04 .lobby-lift:not(.target){filter:brightness(.68) saturate(.72);transition:filter .65s}.real-entrance.zoom-to-04 .target{filter:brightness(1.16);box-shadow:0 0 0 3px #d5dc8b,0 0 34px #d5dc8baa}.zoom-focus-ring{position:absolute;z-index:44;top:11%;right:2.5%;width:25%;height:57%;border:2px solid rgba(255,249,205,.72);border-radius:8px;box-shadow:0 0 22px rgba(255,245,158,.18),inset 0 0 18px rgba(183,226,239,.09);opacity:0;transform:scale(1.08);pointer-events:none;transition:opacity .38s,transform .8s cubic-bezier(.18,.75,.2,1)}.real-entrance.zoom-to-04 .zoom-focus-ring{opacity:1;transform:scale(1)}.real-entrance.walking-in .zoom-focus-ring{opacity:0;transform:scale(1.3)}

/* 強化版：入口シーン全体を04号機中心へ明確にズーム */
.entrance{overflow:hidden}.entrance:before{content:"";position:absolute;z-index:1;inset:0;background:radial-gradient(circle at 83% 42%,transparent 0 16%,rgba(0,0,0,0) 28%,rgba(0,0,0,.38) 72%,rgba(0,0,0,.58) 100%);opacity:0;pointer-events:none;transition:opacity .55s ease}.entrance.zoom-to-04:before{opacity:1}.entrance-card,.elevator-bank{will-change:transform,opacity,filter}.entrance.zoom-to-04 .elevator-bank{transform:translateX(-66%) scale(1.62)!important;transform-origin:82% 44%!important;transition:transform 1.05s cubic-bezier(.16,.8,.19,1),filter .75s ease!important}.entrance.walking-in .elevator-bank{transform:translateX(-79%) translateY(8%) scale(2.72)!important;transform-origin:84% 48%!important;transition:transform 1.75s cubic-bezier(.14,.82,.18,1),filter 1.1s ease!important}.entrance.inside-lift .elevator-bank{transform:translateX(-86%) translateY(15%) scale(3.75)!important;transform-origin:85% 50%!important;transition:transform .82s cubic-bezier(.18,.76,.22,1),filter .72s ease!important}.entrance.zoom-to-04 .target{z-index:20}.entrance.zoom-to-04 .lobby-lift:not(.target){opacity:.54;filter:brightness(.55) saturate(.6)}.entrance.zoom-to-04 .zoom-focus-ring{right:0;top:9%;width:28%;height:61%;opacity:1;transform:scale(1)}
@media(max-width:760px){.entrance.zoom-to-04 .elevator-bank{transform:translateX(-65%) scale(1.55)!important}.entrance.walking-in .elevator-bank{transform:translateX(-78%) translateY(9%) scale(2.45)!important}.entrance.inside-lift .elevator-bank{transform:translateX(-84%) translateY(15%) scale(3.25)!important}}
@media(max-width:760px){.elevator-bank{top:14%;height:45%;gap:4px}.lobby-lift{border-left-width:4px;border-right-width:4px}.lift-number{font-size:clamp(38px,11vw,66px)}.lift-destination{font-size:5px}.lift-destination.small{font-size:3.5px}.lift-glass{width:15px}.target-door{width:45%}.target-door-left{left:5%}.target-door-right{right:5%}.target-half-number{font-size:clamp(38px,11vw,66px)}.target-seam{width:15px}.entrance-card{margin-top:58vh}}
.entrance-card{margin-top:55vh;width:min(720px,90%);padding:22px;text-align:center;border:4px solid var(--cream);border-radius:22px;background:#252d45f2;box-shadow:10px 10px 0 #67719b80}.entrance-card strong{color:var(--yellow)}.game{align-items:stretch;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 5%,#5d676b,#171b1e 60%,#050607)}.elevator{position:relative;display:grid;grid-template-columns:130px minmax(0,1fr) 130px;grid-template-rows:72px minmax(580px,1fr);width:min(1250px,100%);min-height:calc(100vh - 32px);overflow:hidden;border:7px solid #242b2e;background:linear-gradient(90deg,#687276,#c2c7c9 14%,#555d61 50%,#c2c7c9 86%,#687276);box-shadow:0 18px 55px #000c}.status{grid-column:1/4;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#080c0f;border-bottom:5px solid #30373b;font-weight:900}.status .cyan{color:var(--cyan)}.status .yellow{color:var(--yellow)}.side{z-index:10;padding:12px 8px;background:linear-gradient(90deg,#515a5f,#b3b9bc 48%,#596267);border-inline:4px solid #4d565a}.monitor{padding:12px 4px;margin-bottom:20px;text-align:center;background:#091012;border:4px solid #515b60;color:#ffb000;font:900 25px monospace;text-shadow:0 0 10px #ff7900}.arrow.down{display:inline-block;transform:rotate(180deg)}.floors{display:flex;flex-direction:column;align-items:center;gap:13px}.floor-btn{width:47px;height:47px;border:4px solid #5a6266;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#aab0b3 48%,#60696d);font-weight:900}.floor-btn.active{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 18px var(--yellow);transform:scale(1.07)}.door-area{position:relative;display:flex;overflow:hidden;background:#071117}.moving{position:absolute;inset:0;opacity:0;background:repeating-linear-gradient(90deg,transparent 0 40px,#55c8e866 41px 47px),repeating-linear-gradient(180deg,#08151d 0 50px,#314e5c 51px 58px,#0b1720 59px 110px)}.elevator.rising .moving,.elevator.d const $=id=>document.getElementById(id), wait=ms=>new Promise(r=>setTimeout(r,ms));
const screens=[...document.querySelectorAll('.screen')];let selected=[],idx=0,currentFloor=1,life=3,correctCount=0,combo=0,busy=false,lastCorrect=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function conceptKey(q){
 const text=((q.question||'')+' '+(q.choices||[]).join(' ')).toLowerCase();
 const fixed=[
  ['TERM_ラテ',['ラテ','ラジオ・テレビ','ラジオ・tv']],
  ['TERM_AOL',['aol','access on line']],
  ['TERM_OL',['outlook','「ol」',' olとは']],
  ['TERM_RC',['リスクチェッカー','「rc」',' rcとは']],
  ['TERM_BC',['ビズリーチ・キャンパス','「bc」',' bcとは']],
  ['TERM_TKF',['tkf']],
  ['TERM_ウルプネカ',['ウルプネカ']],
  ['TERM_HRM',['hrm','hrbp']],
  ['TERM_パルスサーベイ',['パルスサーベイ']],
  ['TERM_communication sheet',['communication sheet','コミュニケーションシート']]
 ];
 for(const [key,words] of fixed){if(words.some(w=>text.includes(w.toLowerCase())))return key}
 return q.tag||q.id;
}
function pickDistinct(band,count,usedIds,usedConcepts){
 const pool=shuffle(QUESTION_BANK.filter(q=>q.band===band&&!usedIds.has(q.id)&&q.review!=='非採用'));
 const out=[],categoryCounts=new Map(),questionTexts=new Set();
 const add=q=>{
  const key=conceptKey(q),normalized=(q.question||'').replace(/\s+/g,'').replace(/[「」『』（）()、。！？!?・：:]/g,'');
  if(usedIds.has(q.id)||usedConcepts.has(key)||questionTexts.has(normalized))return false;
  out.push(q);usedIds.add(q.id);usedConcepts.add(key);questionTexts.add(normalized);
  categoryCounts.set(q.category,(categoryCounts.get(q.category)||0)+1);return true;
 };
 for(const q of pool){if((categoryCounts.get(q.category)||0)<3&&add(q)&&out.length===count)break}
 if(out.length<count){for(const q of pool){if(add(q)&&out.length===count)break}}
 if(out.length!==count)throw new Error('重複なしで必要数を抽出できません: '+band+' '+out.length+'/'+count);
 return out;
}
function buildRun(){
 const usedIds=new Set(),usedConcepts=new Set();
 const fixedQ5=QUESTION_BANK.find(q=>q.id==='Q700');
 usedIds.add(fixedQ5.id);usedConcepts.add(conceptKey(fixedQ5));
 const randomBasics=pickDistinct('Q1-8候補',7,usedIds,usedConcepts);
 const foundation=[...randomBasics.slice(0,4),fixedQ5,...randomBasics.slice(4,7)];
 const overview=pickDistinct('Q9-14候補',6,usedIds,usedConcepts);
 const interview=pickDistinct('Q15-24候補',9,usedIds,usedConcepts);
 const operations=pickDistinct('Q25-32候補',9,usedIds,usedConcepts);
 const expert=pickDistinct('Q33-39候補',7,usedIds,usedConcepts);
 selected=[...foundation,...overview,...interview,...operations,...expert].map(prepare);
 if(selected.length!==39)throw new Error('出題数が39問ではありません');
}
function prepare(q){let opts=q.choices.map((t,i)=>({t,correct:'ABCD'[i]===q.correct})).filter(x=>x.t!==null&&x.t!=='');if(q.format!=='○×')opts=shuffle(opts);return {...q,opts}}
function showScreen(s){screens.forEach(x=>x.classList.remove('active'));s.classList.add('active')}
function createFloors(){for(const id of ['leftButtons','rightButtons']){$(id).innerHTML='';[36,25,14,4].forEach(n=>{const b=document.createElement('button');b.className='floor-btn';b.textContent=n;b.dataset.floor=n;$(id).appendChild(b)})}}
function activeFloor(f){document.querySelectorAll('.floor-btn').forEach(b=>{const n=+b.dataset.floor;b.classList.toggle('active',(n===36&&f>=36)||(n===25&&f>=25&&f<36)||(n===14&&f>=14&&f<25)||(n===4&&f>=4&&f<14))})}
function setFloor(f){currentFloor=f;['leftFloor','rightFloor','floor','rideFloor'].forEach(id=>$(id).textContent=f+'F');activeFloor(f)}
function hearts(){return '♥'.repeat(life)+'♡'.repeat(3-life)}
function showQuestion(){busy=false;const q=selected[idx];$('qnum').textContent=String(idx+1).padStart(2,'0');$('qtype').textContent=idx===38?'FINAL QUESTION':'QUESTION';$('question').textContent=q.question;$('life').textContent=hearts();$('answers').innerHTML='';q.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=(q.format==='○×'?'':String.fromCharCode(65+i)+'　')+o.t;b.onclick=()=>answer(i);$('answers').appendChild(b)});$('quiz').classList.remove('hide')}
function answer(i){if(busy)return;busy=true;const q=selected[idx],buttons=[...document.querySelectorAll('.answer')],chosen=q.opts[i];lastCorrect=chosen.correct;buttons.forEach(b=>b.disabled=true);if(lastCorrect){correctCount++;combo++;buttons[i].classList.add('correct');$('resultTitle').textContent='CORRECT!';$('resultTitle').style.color='var(--green)';$('next').textContent=idx===38?'40Fへ向かう':'次の階へ';$('explanation').textContent=q.explanation}else{life--;combo=0;buttons[i].classList.add('wrong');buttons.forEach((b,j)=>{if(q.opts[j].correct)b.classList.add('correct')});$('resultTitle').textContent='WRONG!';$('resultTitle').style.color='var(--red)';$('next').textContent=life<=0?'結果を見る':'同じ問題に再挑戦';$('explanation').textContent='正解：'+q.opts.find(x=>x.correct).t+'。'+q.explanation}$('life').textContent=hearts();$('result').classList.remove('hidden')}
async function rise(final=false){$('quiz').classList.add('hide');$('ride').classList.add('show');$('rideLabel').textContent=final?'40Fへ上昇中…':'上昇中…';$('elevator').classList.add('rising');await wait(500);setFloor(final?40:currentFloor+1);await wait(final?1700:750);$('elevator').classList.remove('rising');$('ride').classList.remove('show');$('elevator').classList.add('bump');await wait(450);$('elevator').classList.remove('bump')}
$('next').onclick=async()=>{if(busy===false)return;$('result').classList.add('hidden');if(life<=0){$('goFloor').textContent=currentFloor+'F';$('goCorrect').textContent=correctCount+' / 39';showScreen($('gameover'));return}if(!lastCorrect){showQuestion();return}if(idx===38){await rise(true);$('welcome').classList.add('visible');makeConfetti();await wait(300);$('elevator').classList.add('open');busy=false;return}await rise(false);idx++;if([4,14,25,36].includes(currentFloor)){if(life<3)life++;$('life').textContent=hearts();$('cpFloor').textContent=currentFloor+'F';$('cpText').textContent='LIFEを回復しました。';$('checkpoint').classList.add('show')}else showQuestion()}
$('cpNext').onclick=()=>{$('checkpoint').classList.remove('show');showQuestion()}
function start(){buildRun();idx=0;life=3;correctCount=0;combo=0;busy=false;$('elevator').className='elevator';$('welcome').classList.remove('visible');$('confetti').innerHTML='';setFloor(1);showQuestion()}
$('board').onclick=async()=>{if(busy)return;busy=true;const e=$('entrance'),rig=$('doorRig'),blackout=$('boardingBlackout');$('board').disabled=true;$('board').textContent='09号機へ向かいます…';e.classList.add('walking');await wait(1350);e.classList.add('close-match');await wait(480);$('board').textContent='09号機が到着しました';rig.classList.add('ready');await wait(260);$('board').textContent='扉が開いています…';rig.classList.add('opening');await wait(1080);$('board').textContent='乗車します';e.classList.add('boarding');await wait(700);blackout.classList.add('show');await wait(420);showScreen($('game'));start();await wait(180);blackout.classList.remove('show');e.classList.remove('walking','close-match','boarding');rig.classList.remove('ready','opening');$('board').disabled=false;$('board').textContent='エレベーターに乗る';busy=false;};$('retry').onclick=()=>{showScreen($('game'));start()}
$('down').onclick=async()=>{if(busy)return;busy=true;$('elevator').classList.remove('open');await wait(1300);$('welcome').classList.remove('visible');$('confetti').innerHTML='';$('ride').classList.add('show');$('rideLabel').textContent='1Fへ下降中…';$('leftArrow').classList.add('down');$('rightArrow').classList.add('down');$('elevator').classList.add('descending');for(const f of[40,30,20,10,1]){setFloor(f);await wait(430)}$('elevator').classList.remove('descending');$('ride').classList.remove('show');$('leftArrow').classList.remove('down');$('rightArrow').classList.remove('down');start()};$('end').onclick=()=>$('shutdown').classList.add('show');
function makeConfetti(){$('confetti').innerHTML='';const colors=['#fff000','#ff365d','#63e9ff','#fff','#ff8a2b','#7c83ae'];for(let i=0;i<48;i++){const s=document.createElement('span');s.className='confetti';s.style.left=Math.random()*100+'%';s.style.background=colors[i%colors.length];s.style.animationDelay=Math.random()*2+'s';s.style.animationDuration=2.8+Math.random()*2+'s';$('confetti').appendChild(s)}}
createFloors();activeFloor(1);
</script>

<script>
(()=>{
 const PASS_HASH='9914fa0ae433797acafec84704fa84c69466fe0977554a719ce5f9b5c85bc7b4',form=document.getElementById('titlePasswordForm'),input=document.getElementById('titlePassword'),error=document.getElementById('titlePasswordError'),button=document.getElementById('enter');
 let failures=0,lockedUntil=0,timer=null;
 const toHex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
 async function digestText(v){return toHex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)))}
 function refresh(){const left=Math.max(0,Math.ceil((lockedUntil-Date.now())/1000));if(left>0){button.disabled=true;input.disabled=true;error.textContent=`入力上限です。${left}秒後に再試行できます。`;return}clearInterval(timer);timer=null;button.disabled=false;input.disabled=false;error.textContent='';input.focus()}
 form.addEventListener('submit',async e=>{e.preventDefault();if(Date.now()<lockedUntil)return;button.disabled=true;error.textContent='確認中…';if((await digestText(input.value))===PASS_HASH){error.textContent='';input.value='';showScreen(document.getElementById('entrance'));button.disabled=false;return}failures++;input.value='';error.textContent='パスワードが違います。';if(failures>=5){failures=0;lockedUntil=Date.now()+30000;timer=setInterval(refresh,250);refresh();return}button.disabled=false;input.focus()});
 window.addEventListener('load',()=>setTimeout(()=>input.focus(),100));
})();
</script>
</body></html>
